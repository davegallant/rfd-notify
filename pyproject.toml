[project]
name = "rfd-notify"
version = "2.1.0"
description = "get notified of deals based on regex"
authors = [{ name = "Dave Gallant", email = "davegallant@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.33.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "loguru>=0.7.2,<0.8.0",
    "apprise>=1.7.1,<2.0.0",
    "humanize>=4.12.1,<5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "black>=26.3.1,<27.0.0",
    "pylint>=4.0.0,<5.0.0",
    "rope>=1.11.0,<2.0.0",
    "mypy>=2.0.0,<3.0.0",
    "types-requests>=2.31.0.20240106,<3.0.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rfd_notify"]
